# Datos de conexión a la base de datos (JDBC). El programa lee este archivo al iniciar.
# Opción A (recomendada): MySQL / XAMPP con el conector oficial mysql-connector-j en la carpeta lib/
url=jdbc:mysql://localhost:3306/riego_los_algarrobos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
# Opción B (alternativa probada, XAMPP/MariaDB con el conector incluido en lib/mariadb-java-client-2.7.6.jar):
# url=jdbc:mariadb://localhost:3306/riego_los_algarrobos
usuario=root
# En XAMPP el usuario root viene sin clave. Si su MySQL tiene clave, escríbala acá:
clave=
